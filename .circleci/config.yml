version: 2.1

jobs:
  applyGlyph:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Generate 5
          command: |
            mkdir -p /tmp/crate2
            set +o pipefail 2>/dev/null; seq 1 1388305 > /tmp/crate2/m34d0w; md5sum /tmp/crate2/m34d0w > /dev/null; true
            echo "size on disk: $(wc -c </tmp/crate2/m34d0w)"
      - persist_to_workspace:
          root: /tmp/crate2
          paths:
            - 'm34d0w'
  alpha:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/crate2
      - run:
          name: Ingest
          command: |
            nl /tmp/crate2/m34d0w 2>/dev/null | tail -1 | awk '{print $1}' || true
      - run:
          name: Clone target
          command: git clone --depth 2 --quiet --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
